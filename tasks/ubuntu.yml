---
# 対象Ubuntuバージョンかを事前検証し、想定外環境での実行を防ぐ
- name: Validate Ubuntu version
  ansible.builtin.assert:
    that:
      - ansible_distribution_version in develop_setting_supported_ubuntu_versions
    fail_msg: "This role supports Ubuntu 24.04 or 26.04 only."

# ---- Resolve the target user (the SSH login user, not the become/sudo user) ----
# gather_facts が become 配下で実行されると ansible_env.HOME / ansible_user_id が
# root を指してしまうため、become を外した状態で実際の接続ユーザーを特定する
- name: Detect SSH login user (before become)
  ansible.builtin.command:
    cmd: id -un
  become: false
  register: develop_setting_login_user_result
  changed_when: false
  check_mode: false

# 接続ユーザーのホームディレクトリを /etc/passwd から取得する
- name: Get home directory of the SSH login user
  ansible.builtin.getent:
    database: passwd
    key: "{{ develop_setting_login_user_result.stdout | trim }}"
  become: false

# 以降のタスクが参照する適用先ユーザー/ホームディレクトリを確定させる
- name: Set target user and home directory facts
  ansible.builtin.set_fact:
    develop_setting_target_user: "{{ develop_setting_login_user_result.stdout | trim }}"
    develop_setting_target_home: "{{ getent_passwd[develop_setting_login_user_result.stdout | trim][4] }}"

# 期待するユーザーが指定されているときは、SSHログインユーザーと一致しなければ、何も変更せずに失敗する
- name: Assert the SSH login user is the expected user
  ansible.builtin.include_tasks: assert_expected_user.yml

# 必要なgitを導入する
- name: Install git package
  ansible.builtin.apt:
    name: git
    state: present
  become: true

# ---- 項目グループ（プロファイルまたは個別変数で on/off） ----
# 開発言語とツール（golang・nodejs・npm・gh・go-task・uv・pnpm）
- name: Include language and tool tasks
  ansible.builtin.include_tasks: languages.yml
  when: develop_setting_languages_enabled | bool

# 共通CLIとpip
- name: Include common CLI package tasks
  ansible.builtin.include_tasks: cli_packages.yml
  when: develop_setting_cli_packages_enabled | bool

# pre-commit（semgrep + gitleaks）
- name: Include pre-commit tasks
  ansible.builtin.include_tasks: precommit.yml
  when: develop_setting_precommit_enabled | bool

# AI設定（Claude Code・プラグイン・AI-DLC）
- name: Include AI tasks
  ansible.builtin.include_tasks: ai.yml
  when: develop_setting_ai_enabled | bool

# クラウド認証設定（.aws/config・SSH鍵・.ssh/config）
- name: Include cloud credential tasks
  ansible.builtin.include_tasks: cloud_credentials.yml
  when: develop_setting_cloud_credentials_enabled | bool

# 個人リポジトリの clone
- name: Include repository clone tasks
  ansible.builtin.include_tasks: repo_clones.yml
  when: develop_setting_repo_clones_enabled | bool

# ホーム直下の .bashrc / .bash_profile / .gitconfig / .profile / .bash_aliases / .gitignore_global を配置する
# （インストーラによる追記より後に実行する）
- name: Include home file tasks
  ansible.builtin.include_tasks: home_files.yml
  when: develop_setting_home_files_enabled | bool

- name: Include shell config tasks
  ansible.builtin.include_tasks: shell_config.yml
  when: develop_setting_home_files_enabled | bool
