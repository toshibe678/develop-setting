---
# ---- クラウド認証設定（.aws/config、SSH鍵、.ssh/config）。workstation プロファイルで有効、server では無効 ----
# 元ファイルは Playbook側が Vault 暗号化した状態で渡す（絶対パス）。role は中身を読まず、copy / template が自動で復号する
- name: Validate credential sources are provided
  ansible.builtin.assert:
    that:
      - develop_setting_aws_config_src | length > 0
      - develop_setting_ssh_private_key_src | length > 0
    fail_msg: >-
      クラウド認証設定が有効ですが、develop_setting_aws_config_src または develop_setting_ssh_private_key_src が未設定です。
      Playbook側で Vault 暗号化ファイルの絶対パスを渡してください。
    quiet: true

# SSH の設定ディレクトリを作成する（0700）
- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: "{{ develop_setting_target_home }}/.ssh"
    state: directory
    mode: '0700'
  become: false

# AWS の設定ディレクトリを作成する（0700）
- name: Ensure .aws directory exists
  ansible.builtin.file:
    path: "{{ develop_setting_target_home }}/.aws"
    state: directory
    mode: '0700'
  become: false

# .aws/config を配置する（秘密値を含むためログに出さない）
- name: Deploy .aws/config
  ansible.builtin.template:
    src: "{{ develop_setting_aws_config_src }}"
    dest: "{{ develop_setting_target_home }}/.aws/config"
    mode: '0600'
    backup: true
  become: false
  no_log: true

# SSH 秘密鍵を配置する（秘密値のためログに出さない）
- name: Deploy SSH private key
  ansible.builtin.copy:
    src: "{{ develop_setting_ssh_private_key_src }}"
    dest: "{{ develop_setting_target_home }}/.ssh/id_ed25519"
    mode: '0600'
    backup: true
  become: false
  no_log: true

# .ssh/config を配置する
- name: Deploy .ssh/config
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "{{ develop_setting_target_home }}/.ssh/config"
    mode: '0600'
    backup: true
  become: false
  when: develop_setting_ssh_config_enabled | bool
