---
# ---- 開発言語とツール（Ubuntu標準のaptパッケージ。外部のリポジトリと署名鍵は追加しない） ----
# golang・nodejs・npm・gh を導入する（外部取得は再試行つき）
- name: Install language and tool packages (apt)
  ansible.builtin.apt:
    name: "{{ develop_setting_language_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  register: develop_setting_language_packages_result
  until: develop_setting_language_packages_result is succeeded
  retries: "{{ develop_setting_installer_retries }}"
  delay: "{{ develop_setting_installer_delay }}"

# npm の registry を対象ユーザーの ~/.npmrc に書く（root の設定ではなく、適用先ユーザーの設定にする）
- name: Configure npm registry in ~/.npmrc
  ansible.builtin.lineinfile:
    path: "{{ develop_setting_target_home }}/.npmrc"
    regexp: '^registry='
    line: "registry={{ develop_setting_npm_registry }}"
    create: true
    mode: '0600'
  become: false

# npm があるかを確認する（check モードの apt は何も入れないため、クリーンなホストでは npm が無い）
- name: Check if npm is available
  ansible.builtin.command:
    cmd: which npm
  become: false
  register: develop_setting_npm_which
  changed_when: false
  failed_when: false
  check_mode: false

# go-task をグローバルに導入する（npm）。check モードで npm が無いときは飛ばす（実行時は上の apt が入れる）
- name: Install go-task globally via npm
  when: not ansible_check_mode or develop_setting_npm_which.rc == 0
  community.general.npm:
    name: "{{ develop_setting_go_task_npm_package }}"
    global: true
    state: present
    # root で導入するため /root/.npmrc は使われる。registry は引数で明示して、flatt.tech を確実に使う
    registry: "{{ develop_setting_npm_registry }}"
  become: true
  register: develop_setting_go_task_result
  until: develop_setting_go_task_result is succeeded
  retries: "{{ develop_setting_installer_retries }}"
  delay: "{{ develop_setting_installer_delay }}"

# uvコマンドの有無を確認し、インストール要否を判定する（check モードでも確認する）
- name: Check if uv is already installed
  ansible.builtin.shell:
    cmd: 'export PATH="{{ develop_setting_target_home }}/.local/bin:$PATH" && command -v uv'
    executable: /bin/bash
  become: false
  register: uv_which
  changed_when: false
  failed_when: false
  check_mode: false

# 未導入時のみ公式インストーラでuvを導入する（取得は get_url、再試行つき）
- name: Install uv via the shared installer task
  ansible.builtin.include_tasks: install_script.yml
  vars:
    develop_setting_installer_name: uv
    develop_setting_installer_url: "{{ develop_setting_uv_install_url }}"
    develop_setting_installer_shell: sh
  when: uv_which.rc != 0

# pnpmコマンドの有無を確認し、インストール要否を判定する
- name: Check if pnpm is already installed
  ansible.builtin.shell:
    cmd: 'export PATH="{{ develop_setting_target_home }}/.local/share/pnpm/bin:{{ develop_setting_target_home }}/.local/share/pnpm:{{ develop_setting_target_home }}/.local/bin:$PATH" && command -v pnpm'
    executable: /bin/bash
  become: false
  register: pnpm_which
  changed_when: false
  failed_when: false
  check_mode: false

# 未導入時のみ公式インストーラでpnpmを導入する（取得は get_url、再試行つき）
- name: Install pnpm via the shared installer task
  ansible.builtin.include_tasks: install_script.yml
  vars:
    develop_setting_installer_name: pnpm
    develop_setting_installer_url: "{{ develop_setting_pnpm_install_url }}"
    develop_setting_installer_shell: sh
    develop_setting_installer_env:
      SHELL: /bin/bash
  when: pnpm_which.rc != 0

# ---- Supply chain attack countermeasures: package manager cooldown ----
# npm/pnpmの新規公開直後パッケージ利用を遅延させる設定を ~/.npmrc に適用する
- name: Configure .npmrc minimum-release-age for pnpm/npm (supply chain protection)
  ansible.builtin.lineinfile:
    path: "{{ develop_setting_target_home }}/.npmrc"
    regexp: '^minimum-release-age='
    line: "minimum-release-age={{ develop_setting_npm_minimum_release_age }}"
    create: true
    mode: '0600'
  become: false

# uv設定ディレクトリを作成し、続く設定ファイル配置に備える
- name: Ensure uv config directory exists
  ansible.builtin.file:
    path: "{{ develop_setting_target_home }}/.config/uv"
    state: directory
    mode: '0755'
  become: false
  when: develop_setting_uv_exclude_newer != ""

# uvのexclude-newerを設定し、最新過ぎるパッケージの利用を抑制する
- name: Configure uv exclude-newer (supply chain protection)
  ansible.builtin.lineinfile:
    path: "{{ develop_setting_target_home }}/.config/uv/uv.toml"
    regexp: '^exclude-newer\s*='
    line: 'exclude-newer = "{{ develop_setting_uv_exclude_newer }}"'
    create: true
    mode: '0644'
  become: false
  when: develop_setting_uv_exclude_newer != ""
