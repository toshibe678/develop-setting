---
# WSL経由Windows設定を使う場合、対象Windowsユーザー名の指定を必須にする
- name: Validate Windows username for WSL mode
  ansible.builtin.assert:
    that:
      - develop_setting_windows_user_name | length > 0
    fail_msg: "Set develop_setting_windows_user_name when develop_setting_windows_from_wsl_enabled=true."

# WSLから参照するWindowsホームディレクトリの存在を確認する
- name: Check target Windows home directory exists
  ansible.builtin.stat:
    path: "{{ develop_setting_windows_home_dir }}"
  register: windows_home_dir_stat

# 対象Windowsホームが見つからない場合は明示的に失敗させる
- name: Fail when target Windows home directory does not exist
  ansible.builtin.assert:
    that:
      - windows_home_dir_stat.stat.exists
      - windows_home_dir_stat.stat.isdir
    fail_msg: "Target Windows home directory not found: {{ develop_setting_windows_home_dir }}"

# Windowsホーム配下のClaude設定ディレクトリを作成する
- name: Ensure Windows Claude config directory exists from WSL
  ansible.builtin.file:
    path: "{{ develop_setting_windows_claude_config_dir }}"
    state: directory
    mode: '0755'
  become: false

# Claude Codeのフックが使うjqの配置先ディレクトリをWindowsホーム配下に作成する
- name: Ensure Windows user local bin directory exists from WSL
  ansible.builtin.file:
    path: "{{ develop_setting_windows_home_dir }}/.local/bin"
    state: directory
    mode: '0755'
  become: false

# Claude Codeのフックが使うjqを公式リリースから配置する（checksumで改ざんを検知）
- name: Install jq for Claude Code hooks to Windows home from WSL
  ansible.builtin.get_url:
    url: "{{ develop_setting_jq_windows_url }}"
    dest: "{{ develop_setting_windows_home_dir }}/.local/bin/jq.exe"
    checksum: "{{ develop_setting_jq_windows_checksum }}"
    mode: '0755'
  become: false

# Git Bash経由で実行されるフックからjqを参照できるよう、WindowsのユーザーPATHに追加する
- name: Add user local bin to Windows user PATH from WSL
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      # WSLENV でWindows側プロセスへ配置先パスを環境変数として渡す
      export JQ_BIN_DIR="$(wslpath -w "{{ develop_setting_windows_home_dir }}/.local/bin")"
      export WSLENV="JQ_BIN_DIR${WSLENV:+:$WSLENV}"
      powershell.exe -NoProfile -Command '
        $dir = $env:JQ_BIN_DIR;
        $path = [Environment]::GetEnvironmentVariable("Path", "User");
        if (($path -split ";") -contains $dir) { "unchanged" }
        else {
          if ($path) { $new = $path.TrimEnd(";") + ";" + $dir } else { $new = $dir };
          [Environment]::SetEnvironmentVariable("Path", $new, "User");
          "changed"
        }' | tr -d '\r'
    executable: /bin/bash
  register: windows_user_path_result
  changed_when: windows_user_path_result.stdout | trim == 'changed'
  become: false

# Windowsホーム配下へユーザーレベルのCLAUDE.mdを配置する
- name: Deploy user-level CLAUDE.md to Windows home from WSL
  ansible.builtin.template:
    src: claude_CLAUDE.md.j2
    dest: "{{ develop_setting_windows_claude_config_dir }}/CLAUDE.md"
    mode: '0644'
  become: false

# Windowsホーム配下へユーザーレベルのsettings.jsonを配置する
- name: Deploy user-level Claude settings.json to Windows home from WSL
  ansible.builtin.template:
    src: claude_settings.json.j2
    dest: "{{ develop_setting_windows_claude_config_dir }}/settings.json"
    mode: '0644'
  become: false
