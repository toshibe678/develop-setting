---
develop_setting_supported_windows_pattern: 'Windows 11'
develop_setting_supported_ubuntu_versions:
  - "24.04"
  - "26.04"

# 設定の適用先ユーザー（sudo/becomeする前のSSH接続ユーザー）
# ubuntu.yml 冒頭の検出タスクで実測値に上書きされる。ここでの値は
# become を使わない実行や、検出タスク実行前に参照された場合のフォールバック。
develop_setting_target_user: "{{ ansible_user_id }}"
develop_setting_target_home: "{{ ansible_env.HOME }}"

develop_setting_claude_install_url: "https://claude.ai/install.sh"
develop_setting_uv_install_url: "https://astral.sh/uv/install.sh"
develop_setting_pnpm_install_url: "https://get.pnpm.io/install.sh"
develop_setting_claude_sandbox_packages:
  - bubblewrap
  - libcap2-bin
  - libseccomp2
# Claude Codeのフック（~/.claude/hooks/*.sh）が入出力のJSON処理に使うパッケージ
develop_setting_claude_hook_packages:
  - jq
# Windowsではjqの公式リリースバイナリを配置する（WinRM経由ではwingetが使えないため）
# バージョン更新時は https://github.com/jqlang/jq/releases の sha256sum.txt で checksum も更新する
develop_setting_jq_windows_version: "1.8.2"
develop_setting_jq_windows_url: "https://github.com/jqlang/jq/releases/download/jq-{{ develop_setting_jq_windows_version }}/jq-windows-amd64.exe"
develop_setting_jq_windows_checksum: "sha256:a6fc67fedaf9128a3309a1e2ebb8b986aeccf70122ee46d2cb4849e423f0c627"
develop_setting_claude_update_cron_minute: "0"
develop_setting_claude_update_cron_hour: "4"

# Security scanning: semgrep + gitleaks via pre-commit
develop_setting_security_hooks_dir: "{{ develop_setting_target_home }}/.git/hooks"
develop_setting_security_precommit_config: "{{ develop_setting_target_home }}/.pre-commit-config.yaml"
develop_setting_gitleaks_rev: "v8.18.0"
develop_setting_semgrep_rev: "v1.68.0"

# Supply chain attack countermeasures: package manager cooldown settings
# pnpm / npm: minimum-release-age (.npmrc) (days as integer)
develop_setting_npm_minimum_release_age: "7"
# uv: exclude-newer (uv.toml) — RFC 3339 timestamp, e.g. "2024-01-01T00:00:00Z"
# Leave empty ("") to disable. Update this value periodically (e.g. "now minus 7 days").
develop_setting_uv_exclude_newer: ""

# Claude Code user-level configuration (~/.claude)
develop_setting_claude_config_dir: "{{ develop_setting_target_home }}/.claude"

# SSH形式のURLを使い、対象ユーザーの ~/.ssh 配下の鍵で認証する
# （HTTPS形式ではプライベートリポジトリでユーザー名/パスワードを対話要求されて失敗する）
# git のSSH接続コマンド。未知のホスト鍵は初回のみ自動登録し、非対話実行での停止を防ぐ
develop_setting_git_ssh_command: "ssh -o StrictHostKeyChecking=accept-new"

# WSLからWindowsホーム配下へ設定を適用するモード
develop_setting_windows_from_wsl_enabled: false
develop_setting_windows_from_wsl_mount_dir: "/mnt/"
develop_setting_windows_user_name: ""
develop_setting_windows_home_dir: "{{ develop_setting_windows_from_wsl_mount_dir }}c/Users/{{ develop_setting_windows_user_name }}"
develop_setting_windows_claude_config_dir: "{{ develop_setting_windows_home_dir }}/.claude"

# Claude Code プラグイン/スキルの自動導入
# 追加するマーケットプレイス（name は `claude plugin marketplace list` に表示される名前）
develop_setting_claude_marketplaces:
  - { name: planning-with-files, source: OthmanAdi/planning-with-files }
  - { name: anthropic-agent-skills, source: anthropics/skills }
  - { name: karpathy-skills, source: forrestchang/andrej-karpathy-skills }
  - { name: agent-toolkit-for-aws, source: aws/agent-toolkit-for-aws }
  - { name: pskoett-skills, source: pskoett/pskoett-skills }
# 導入するプラグイン（plugin@marketplace 形式）
develop_setting_claude_plugins:
  - superpowers@claude-plugins-official
  - planning-with-files@planning-with-files
  - code-review@claude-plugins-official
  - document-skills@anthropic-agent-skills
  - andrej-karpathy-skills@karpathy-skills
  - aws-core@agent-toolkit-for-aws
  - aws-data-analytics@agent-toolkit-for-aws
  - aws-agents@agent-toolkit-for-aws
  - pskoett-ai-skills@pskoett-skills
# `npx skills add` で導入するスキル（skill は導入後の ~/.agents/skills/<skill> で冪等判定する）
develop_setting_npx_skills:
  - { skill: find-skills, source: vercel-labs/skills }
  - { skill: agent-browser, source: "https://github.com/vercel-labs/agent-browser" }
  - { skill: browser-use, source: "https://github.com/browser-use/browser-use" }
  - { skill: skill-creator, source: "https://github.com/anthropics/skills" }
  - { skill: kaizen, source: "neolabhq/context-engineering-kit@kaizen", add_skill_option: false }

# AI-DLC（ループとハーネス）
develop_setting_bun_install_url: "https://bun.sh/install"
develop_setting_aidlc_install_url: "https://github.com/awslabs/aidlc-workflows/releases/latest/download/install.sh"
# AI-DLC のインストーラを実行するディレクトリ（全ローカルリポジトリのルート）
develop_setting_aidlc_workdir: "{{ develop_setting_target_home }}/git"
develop_setting_aidlc_harness: "claude"

# ホーム直下の .gitconfig などに埋め込むユーザー情報（Playbook側の -e user_name / user_email があればそれを優先）
develop_setting_user_name: "{{ user_name | default('toshi') }}"
develop_setting_user_email: "{{ user_email | default('toshi@toshi.click') }}"

# ---- プロファイルと項目グループの on/off ----
# workstation: 開発機（WSL）。すべてのグループを有効にする
# server: サーバー。言語・CLI・シェル設定・pre-commit だけを有効にし、AI設定・クラウド認証設定・個人リポジトリのcloneは無効にする
develop_setting_profile: workstation
develop_setting_profile_defaults:
  workstation:
    languages: true
    cli_packages: true
    home_files: true
    precommit: true
    ai: true
    cloud_credentials: true
    repo_clones: true
  server:
    languages: true
    cli_packages: true
    home_files: true
    precommit: true
    ai: false
    cloud_credentials: false
    repo_clones: false
# グループ名の一覧（validate.yml が各 develop_setting_<グループ>_enabled を検証する）
develop_setting_groups:
  - languages
  - cli_packages
  - home_files
  - precommit
  - ai
  - cloud_credentials
  - repo_clones
# グループごとの有効・無効。Playbook側で個別に上書きできる（真偽値のみ）
develop_setting_languages_enabled: "{{ develop_setting_profile_defaults[develop_setting_profile]['languages'] }}"
develop_setting_cli_packages_enabled: "{{ develop_setting_profile_defaults[develop_setting_profile]['cli_packages'] }}"
develop_setting_home_files_enabled: "{{ develop_setting_profile_defaults[develop_setting_profile]['home_files'] }}"
develop_setting_precommit_enabled: "{{ develop_setting_profile_defaults[develop_setting_profile]['precommit'] }}"
develop_setting_ai_enabled: "{{ develop_setting_profile_defaults[develop_setting_profile]['ai'] }}"
develop_setting_cloud_credentials_enabled: "{{ develop_setting_profile_defaults[develop_setting_profile]['cloud_credentials'] }}"
develop_setting_repo_clones_enabled: "{{ develop_setting_profile_defaults[develop_setting_profile]['repo_clones'] }}"

# SSHログインユーザーがこの値と一致しなければ失敗する（空のときは検査しない）。
# 他のユーザーのホームを変更しないための安全装置。infra は manage_user_name を渡す
develop_setting_expected_user: ""

# ---- 開発言語とツール（Ubuntu標準のaptパッケージ。外部のリポジトリと署名鍵は追加しない） ----
develop_setting_language_packages:
  - golang-go
  - nodejs
  - npm
  - gh
develop_setting_npm_registry: "https://npm.flatt.tech"
develop_setting_go_task_npm_package: "@go-task/cli"

# ---- 共通CLIとpip ----
develop_setting_cli_packages:
  - ansible
  - bash-completion
  - bmon
  - curl
  - git
  - htop
  - iftop
  - iotop
  - iproute2
  - iputils-ping
  - iptraf
  - iptraf-ng
  - net-tools
  - nmap
  - sudo
  - sysstat
  - telnet
  - tree
  - unzip
  - vim
  - wget
  - zip
  - python3-pip
develop_setting_pip_index_url: "https://pypi.flatt.tech/simple/"

# ---- git の safe.directory（.gitconfig に出力する。git.yml の追記は使わない） ----
develop_setting_git_safe_directories: []

# ---- 外部インストーラの取得（tasks/install_script.yml） ----
develop_setting_installer_retries: 3
develop_setting_installer_delay: 10
# 一時ファイルの置き場所（未指定ならOSの既定の一時ディレクトリ）
develop_setting_installer_tmpdir: ""

# ---- クラウド認証設定（workstation のみ。Vault暗号化ファイルの絶対パスを Playbook側から渡す） ----
develop_setting_aws_config_src: ""
develop_setting_ssh_private_key_src: ""
develop_setting_ssh_config_enabled: true

# ---- 個人リポジトリのclone（workstation のみ） ----
develop_setting_clone_root: "{{ develop_setting_target_home }}/git"
# clone に使う SSH 秘密鍵（空にすると指定しない）
develop_setting_git_ssh_key_file: "{{ develop_setting_target_home }}/.ssh/id_ed25519"
develop_setting_git_clones:
  - { name: scripts, repo: "git@github.com:toshibe678/scripts.git" }
  - { name: infra, repo: "git@github.com:toshibe678/infra.git" }
  - { name: blog.toshi.click, repo: "git@github.com:toshibe678/blog.toshi.click.git" }
  - { name: CurriculumVitae, repo: "git@github.com:toshibe678/CurriculumVitae.git" }
  - { name: ansible_for_wsl, repo: "git@github.com:toshibe678/ansible_for_wsl.git" }
  - { name: develop, repo: "git@github.com:toshibe678/develop.git" }
